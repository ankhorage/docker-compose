name: Validate Compose config interpolation

on:
  push:
    branches:
      - fix/8-compose-config-dollar
    paths:
      - '.github/workflows/validate-8-config.yml'
      - 'src/**'
      - '.changeset/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/8-compose-config-dollar
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run knip:check
      - run: bun run test
      - run: bun run changeset:status
      - run: bun run format
      - run: git diff --exit-code
